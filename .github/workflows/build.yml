name: Build .deb

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      GLITCHTIP_DOMAIN: ci.example.test

    steps:
      - uses: actions/checkout@v7

      - name: Build GlitchTip .deb
        run: docker build --target artifact --output . .

      - name: Check artifact exists
        run: |
          PKG="$(ls glitchtip_*.deb)"
          test -f "${PKG}"
          dpkg-deb -I "${PKG}" >/dev/null
          ls -lh "${PKG}"

      - uses: actions/upload-artifact@v7
        with:
          name: glitchtip-deb
          path: glitchtip_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: glitchtip-deb

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-prerelease.sh
