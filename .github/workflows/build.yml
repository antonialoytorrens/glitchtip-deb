name: Build .deb

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Prepare container
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates curl tar

      - uses: actions/checkout@v7

      - name: Build GlitchTip .deb
        env:
          GLITCHTIP_DOMAIN: ci.example.test
          DISABLE_DEBOOTSTRAP_CHROOT: 'true'
          KEEP_CHROOT: false
        run: bash build-glitchtip-amd64-deb.sh

      - name: Verify .deb venv
        run: |
          PKG="$(ls glitchtip_*.deb)"
          test -f "${PKG}"
          dpkg-deb -c "${PKG}" | grep -q 'opt/glitchtip/venv/lib/python'
          dpkg-deb -x "${PKG}" /tmp/extract
          /tmp/extract/opt/glitchtip/venv/bin/python -c "import django; print('django', django.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: glitchtip-deb
          path: glitchtip_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: glitchtip-deb

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-prerelease.sh
